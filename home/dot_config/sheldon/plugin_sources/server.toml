# sheldon server 用プラグイン設定
# リモートサーバー環境向け

#
# Path and Fpath for Server Machine
#

[plugins.server-path]
inline = '''
function _server_path() {
    typeset -gU path fpath
    path=(
        $path
        ${HOME}/.local/bin/server(N-/)
    )
    fpath=(
        $fpath
        ${HOME}/.local/bin/server(N-/)
    )
}
zsh-defer _server_path
'''

#
# Server Environment: CUDA PATH
# 環境変数の export は .zshenv で行い、ここでは PATH 操作のみ
#

[plugins.server-cuda-path]
inline = '''
function _server_cuda_path() {
    typeset -gU path
    path=( $path ${CUDA_HOME}/bin(N-/) )
}
zsh-defer _server_cuda_path
'''

#
# SSH Agent
# agent forwarding が使えないサーバーで、pane 間で同じ agent を共有する
#

[plugins.server-ssh-agent]
inline = '''
# キャッシュファイルを直接 source して即座に SSH_AUTH_SOCK を設定
local _keychain_env="$HOME/.keychain/$(hostname)-sh"
[[ -f "$_keychain_env" ]] && source "$_keychain_env"

# バックグラウンドで agent の生存確認と必要なら再起動
(keychain --quiet --nolock --quick --agents ssh ~/.ssh/id_ed25519 &>/dev/null &)
'''
