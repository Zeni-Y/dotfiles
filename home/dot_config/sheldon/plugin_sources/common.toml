# sheldon 共通プラグイン設定
# 全環境 (client/server) で共有するプラグイン群

shell = "zsh"

# =============================================================================
# テンプレート定義
# =============================================================================

[templates]
fzf-path = """
{{ hooks?.pre | nl }}
path=($path {{ dir }}/bin(N-/))
{{ hooks?.post | nl }}
"""

fzf-source = "source <(fzf --zsh)"

# =============================================================================
# Prompt (starship)
# =============================================================================

[plugins.starship]
inline = 'eval "$(starship init zsh)"'

# =============================================================================
# 自動ロードと補完の初期化
# =============================================================================

[plugins.compinit]
inline = '''
autoload -Uz compinit
local zcompdump="${ZDOTDIR:-$HOME}/.zcompdump"
if [[ -f "$zcompdump" && $(date +'%j') == $(date -r "$zcompdump" +'%j' 2>/dev/null) ]]; then
    compinit -C
else
    compinit
fi
'''

# カスタムコマンドを autoload で登録
[plugins.custom-commands]
inline = 'autoload -Uz dev cdgwq cdw fgc chezmoi-cd git-delete-merged-branches uv-format'

# =============================================================================
# fzf（ファジーファインダー）
# =============================================================================

[plugins.fzf]
github = 'junegunn/fzf'
apply = ['fzf-path']
hooks.post = '''
export FZF_DEFAULT_OPTS="--reverse"
'''

# =============================================================================
# zsh 関連プラグイン群
# =============================================================================

[plugins.zsh-autosuggestions]
github = 'zsh-users/zsh-autosuggestions'
apply = ['source']

[plugins.zsh-completions]
github = 'zsh-users/zsh-completions'
apply = ['source']

[plugins.zsh-syntax-highlighting]
github = 'zsh-users/zsh-syntax-highlighting'
apply = ['source']

[plugins.zsh-autopair]
github = 'hlissner/zsh-autopair'
apply = ['source']

[plugins.zsh-history-on-success]
github = 'nyoungstudios/zsh-history-on-success'
apply = ['source']

# =============================================================================
# Oh My Zsh の部分的利用
# =============================================================================

[plugins.oh-my-zsh]
github = "ohmyzsh/ohmyzsh"
use = [
    'lib/functions.zsh',
    'lib/completion.zsh',
    'lib/history.zsh',
    'lib/termsupport.zsh',
    'plugins/fzf/fzf.plugin.zsh',
]

[plugins.zsh-history-shell-options]
inline = '''
setopt INC_APPEND_HISTORY_TIME
setopt INC_APPEND_HISTORY
'''

# =============================================================================
# mise（ランタイムバージョン管理）
# =============================================================================

[plugins.mise]
inline = 'eval "$(~/.local/bin/mise activate zsh)"'

# =============================================================================
# 言語環境の設定
# =============================================================================

[plugins.lang]
inline = "export LANG='en_US.UTF-8'"

[plugins.go]
inline = '''
export GOPATH="${HOME}/ghq"
export GOROOT=$(go env GOROOT)
typeset -gU path
path=(
    $path
    ${GOPATH}/bin(N-/)
    ${HOME}/.go/bin(N-/)
)
'''

[plugins.rust]
inline = '''
typeset -gU path
path=(
    $path
    ${HOME}/.cargo/bin(N-/)
)
'''

[plugins.bun]
inline = '''
export BUN_INSTALL="$HOME/.bun"
typeset -gU path
path+=(
    $BUN_INSTALL/bin(N-/)
)
[ -s "$HOME/.bun/_bun" ] && source "$HOME/.bun/_bun"
'''

# =============================================================================
# zsh-abbr（エイリアスの代替）
# =============================================================================
# fish shell 風の abbreviation を提供
# 入力時に展開され、履歴にはフルコマンドが残る

[plugins.zsh-abbr]
github = "olets/zsh-abbr"
apply = ['source']

# =============================================================================
# zsh-you-should-use
# =============================================================================

[plugins.zsh-you-should-use]
github = "MichaelAquilina/zsh-you-should-use"
apply = ['source']

# =============================================================================
# GPG
# =============================================================================

[plugins.gpg]
inline = '''
export GPG_TTY=$(tty)
'''

# =============================================================================
# chezmoi 更新通知
# =============================================================================
# リモートに未適用の更新があれば starship プロンプトに通知表示

[plugins.chezmoi-notify]
local = "~/.config/zsh/plugins/chezmoi-notify"

# =============================================================================
# プライベート設定
# =============================================================================

[plugins.private-dotfiles]
inline = '''
local filepath="${HOME}/.workrc"
if [ -f "$filepath" ]; then
    source "$filepath"
fi
'''
