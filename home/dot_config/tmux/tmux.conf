# ~/.config/tmux/tmux.conf
# Catppuccin Mocha テーマ × vi キーバインド × TPM プラグイン管理
# shunk031/dotfiles の設計思想を参考に構成
# https://github.com/shunk031/dotfiles

# ============================================================
# プレフィックスキー
# ============================================================
unbind C-b
set -g prefix C-t
bind C-t send-prefix

# ============================================================
# 基本設定
# ============================================================
set -g base-index 1              # ウィンドウ番号を 1 から開始
setw -g pane-base-index 1        # ペイン番号を 1 から開始
set -g renumber-windows on       # ウィンドウ削除後に番号を詰める
set -sg escape-time 10           # Esc の遅延を最小化（Neovim 推奨）
set -g history-limit 50000       # スクロールバックバッファサイズ
set -g display-time 4000         # メッセージの表示時間（ms）
set -g status-interval 5         # ステータスバーの更新間隔（秒）
set -g focus-events on           # フォーカスイベントを有効化（Neovim 推奨）

# ============================================================
# 色・ターミナル設定
# ============================================================
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# ============================================================
# マウスサポート
# ============================================================
set -g mouse on

# ============================================================
# キーバインドモード（vi）
# ============================================================
setw -g mode-keys vi

# ============================================================
# キーバインド
# ============================================================

# 設定リロード
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reload config!!"

# 新規ウィンドウ（現在のパスを維持）
bind c new-window -c "#{pane_current_path}"

# ペイン分割（現在のパスを維持）
bind | split-window -hc "#{pane_current_path}"   # 縦に分割（左右）
bind - split-window -vc "#{pane_current_path}"   # 横に分割（上下）
unbind '"'
unbind %

# ペイン移動（vim 風: hjkl）
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ペインリサイズ（-r で繰り返し可）
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ウィンドウ移動
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# ペイン/ウィンドウを閉じる（確認プロンプトなし）
bind x kill-pane
bind X kill-window

# コピーモード（vi 風）
bind [ copy-mode
bind -T copy-mode-vi v     send -X begin-selection
bind -T copy-mode-vi C-v   send -X rectangle-toggle
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ============================================================
# ステータスバー位置（上部）
# ============================================================
set -g status-position top

# ============================================================
# プラグイン（TPM: Tmux Plugin Manager）
# インストール: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# プラグインの取得/更新: prefix + I / prefix + U
# ============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'catppuccin/tmux#v2.1.2'

# ------------------------------------------------------------
# Catppuccin テーマ
# ------------------------------------------------------------
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"

set -g status-left ""
set -g  status-right "#{E:@catppuccin_status_prefix_highlight}"
set -ag status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

set -g @catppuccin_date_time_text " %Y-%m-%d  %H:%M"

# ------------------------------------------------------------
# tmux-resurrect: セッション保存・復元
# 保存: prefix + Ctrl-s  / 復元: prefix + Ctrl-r
# ------------------------------------------------------------
set -g @resurrect-capture-pane-contents 'on'

# ------------------------------------------------------------
# tmux-continuum: 定期自動保存・起動時自動復元
# ------------------------------------------------------------
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ------------------------------------------------------------
# tmux-prefix-highlight: プレフィックス・コピーモード表示
# ------------------------------------------------------------
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=black,bg=yellow,bold'
set -g @prefix_highlight_prefix_prompt 'C-t'
set -g @prefix_highlight_copy_prompt 'Copy'

# ============================================================
# TPM 初期化（必ずファイルの末尾に記述）
# ============================================================
run '~/.tmux/plugins/tpm/tpm'
