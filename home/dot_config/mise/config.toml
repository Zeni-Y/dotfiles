[tools]
# 言語ランタイム
go = "latest"
node = "lts"
python = "3.12"
rust = "latest"

# パッケージマネージャ / ビルドツール
bun = "latest"
uv = "latest"

# シェル / ターミナル
starship = "latest"
yazi = "latest"
zellij = "latest"
neovim = "latest"
ripgrep = "latest"

# Git
chezmoi = "latest"
gh = "latest"
ghq = "latest"
"github:d-kuro/gwq" = "latest"
lazygit = "latest"

# クラウド / インフラ
aws-cli = "latest"
gcloud = "latest"

# データ処理 / JSON / YAML
jq = "latest"
yq = "latest"

# セキュリティ
# age: aqua レジストリは darwin/amd64 非対応のため ubi (GitHub Releases) 経由で取得
"ubi:FiloSottile/age" = "latest"
dotenvx = "latest"

# Lint / フォーマッタ
shellcheck = "latest"
shfmt = "latest"

# ファイル / ディレクトリ
eza = "latest"
# fd: aqua レジストリは darwin/amd64 非対応のため ubi (GitHub Releases) 経由で取得
"ubi:sharkdp/fd" = "latest"
fzf = "latest"
zoxide = "latest"

# Web / ドキュメント
hugo-extended = "0.136.5"
"github:shuntaka9576/blocc" = "latest"

# テスト
bats = "latest"

# AI コーディング
"npm:@anthropic-ai/claude-code" = "2.1.98"
"npm:@openai/codex" = "latest"
"npm:@github/copilot" = "latest"

# LSP / 開発ツール (npm)
"npm:bash-language-server" = "latest"
"npm:pyright" = "latest"

# ネットワーク
"npm:fast-cli" = "latest"

[settings]
idiomatic_version_file_enable_tools = ["python"]
