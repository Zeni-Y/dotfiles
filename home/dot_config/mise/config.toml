[tools]
# 言語ランタイム（プロジェクト単位のバージョン切替が必要）
go = "latest"
node = "lts"
python = "3.12"
rust = "latest"

# Nix で管理できないツール（nixpkgs 未収録）
"github:d-kuro/gwq" = "latest"
"github:shuntaka9576/blocc" = "latest"
dotenvx = "latest"

# AI コーディング（npm パッケージ、nixpkgs 未収録）
"npm:@anthropic-ai/claude-code" = "latest"
"npm:@openai/codex" = "latest"
"npm:fast-cli" = "latest"

[settings]
idiomatic_version_file_enable_tools = ["python"]
